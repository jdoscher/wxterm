[project]
name = "wxterm"
version = "1.2.0"
description = "Full-screen ASCII/braille weather display for the terminal"
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "pillow>=10"]

[project.scripts]
wxterm = "wxterm.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
