# foot config for the wxterm kiosk. Template: kiosk/setup.sh fills in FONT and FONT_SIZE from kiosk.conf.
# DejaVu Sans Mono at pixel size 13 gives 240x62 cells (8x17 px) on a 1920x1080 screen.
[main]
font=@FONT@:pixelsize=@FONT_SIZE@
pad=0x0
term=xterm-256color

[cursor]
blink=no

[colors]
background=000000
foreground=c0c0c0

[mouse]
hide-when-typing=yes
